name: Actualizar NFL Predictor

on:
  schedule:
    - cron: "0 1,9,17 * * *"   # cada 8 horas: 3:00, 11:00 y 19:00 hora centro de Mexico
  workflow_dispatch:       # boton "Run workflow" para actualizar a mano
  push:                    # al subir cambios de codigo, regenerar (y cifrar) los datos
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar libreria de cifrado
        run: pip install cryptography
      - name: Descargar datos y recalcular predicciones
        env:
          NFL_PASSWORD: ${{ secrets.NFL_PASSWORD }}
        run: python nfl_predictor.py
      - name: Guardar datos
        run: |
          git config user.name "nfl-predictor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Actualizacion automatica $(date -u +%F)"
          git push
