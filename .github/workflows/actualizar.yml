name: Actualizar NFL Predictor

on:
  schedule:
    - cron: "0 9 * * 2"    # martes 3:00 a.m. hora centro de Mexico (estadisticas)
    - cron: "0 20 * * 4"   # jueves 2:00 p.m. (lesiones y clima)
    - cron: "0 15 * * 0"   # domingo 9:00 a.m. (lesiones y clima)
  workflow_dispatch:       # boton "Run workflow" para actualizar a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar libreria de cifrado
        run: pip install cryptography
      - name: Descargar datos y recalcular predicciones
        env:
          NFL_PASSWORD: ${{ secrets.NFL_PASSWORD }}
        run: python nfl_predictor.py
      - name: Guardar datos
        run: |
          git config user.name "nfl-predictor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Actualizacion automatica $(date -u +%F)"
          git push
